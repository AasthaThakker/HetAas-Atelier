# Keeps the Shiprocket login token fresh for the API Worker (delivery charges at checkout).
# Shiprocket rejects logins from Cloudflare's servers, so the token is refreshed from here
# every Monday (tokens are stored for 9 days). If a run fails, GitHub emails the repo owner.
name: Refresh Shiprocket token

on:
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC (08:00 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh token in Cloudflare KV
        run: node worker/scripts/refresh-shiprocket-token.mjs
        env:
          SHIPROCKET_EMAIL: ${{ secrets.SHIPROCKET_EMAIL }}
          SHIPROCKET_PASSWORD: ${{ secrets.SHIPROCKET_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: bab027d35e1d42ff8bb5efaa784ce726
