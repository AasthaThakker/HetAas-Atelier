name = "hetaas-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Public, non-secret settings. Secrets go in the dashboard or `wrangler secret put` (never in git).
[vars]
SITE_URL = "https://hetaas-atelier.aasthathakker.com"
# Sites allowed to call the API: the live shop.
ALLOWED_ORIGIN = "https://hetaas-atelier.aasthathakker.com,https://aasthathakker.github.io"
# Delivery (Shiprocket): cheapest courier from the pickup PIN code, plus a fixed markup in rupees.
PICKUP_PINCODE = "380052"
SHIPPING_MARKUP_INR = "10"
# Packed weight per piece (kg). Heavy = pooja thalis and decor plates.
WEIGHT_STANDARD_KG = "0.5"
WEIGHT_HEAVY_KG = "2"

# Shiprocket courier IDs to skip (comma-separated), e.g. couriers disabled in your Shiprocket panel.
EXCLUDED_COURIER_IDS = ""

# KV storage: the cached Shiprocket login token.
[[kv_namespaces]]
binding = "ORDERS"
id = "bab027d35e1d42ff8bb5efaa784ce726"
